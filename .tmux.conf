# Enable mouse support (scroll, select panes/windows, resize)
set -g mouse on

# Increase scrollback buffer
set -g history-limit 10000

# Use vi keys in copy mode
setw -g mode-keys vi

# Keep selection highlighted after mouse release
unbind -T copy-mode-vi MouseDragEnd1Pane
unbind -T copy-mode MouseDragEnd1Pane

# Copy to system clipboard via OSC 52 (works over SSH/VMs)
set -g set-clipboard on
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# tmux-continuum settings
set -g @continuum-restore 'on'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
